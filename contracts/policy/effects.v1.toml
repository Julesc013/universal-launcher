[effects]
none = "No observable read, write, process, network, or setup effect."
workspace_read = "Reads launcher workspace state, registry state, diagnostics, or filesystem metadata without mutation."
workspace_write = "Writes launcher workspace state such as instances, profiles, launch history, or audit records."
