name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
      - run: python tools/structure_policy_check.py
      - run: cmake -S . -B build/smoke -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/smoke --config Release
      - run: ctest --test-dir build/smoke -C Release --output-on-failure
      - run: python tools/strict_check.py
